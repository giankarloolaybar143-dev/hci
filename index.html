<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Member User ID Registration</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="form-header">
            <h1>Online Member User ID Registration</h1>
            <p>Please supply the following information as reported to the Social Security System.</p>
            <span>* Required Field</span>
        </div>

        <form id="registrationForm">

            <!-- Account Information -->
            <section>
                <h2>Account Information</h2>

                <div class="form-group">
                    <label for="crn">CRN / SS Number <span>*</span></label>
                    <input type="text" id="crn" name="crn" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span>*</span></label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="confirmEmail">Confirm Email Address <span>*</span></label>
                    <input type="email" id="confirmEmail" name="confirmEmail" required>
                </div>

                <div class="form-group">
                    <label for="userId">Preferred User ID <span>*</span></label>
                    <input type="text" id="userId" name="userId"
                           minlength="8" maxlength="20" required>
                    <small>Must be 8–20 characters. First character must be alphabetic.</small>
                </div>

                <div class="form-group">
                    <label for="confirmUserId">Confirm Preferred User ID <span>*</span></label>
                    <input type="text" id="confirmUserId" name="confirmUserId" required>
                </div>
            </section>

            <!-- Personal Information -->
            <section>
                <h2>Personal Information</h2>

                <div class="form-group">
                    <label for="lastName">Surname / Last Name <span>*</span></label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>

                <div class="form-group">
                    <label for="givenName">Given Name <span>*</span></label>
                    <input type="text" id="givenName" name="givenName" required>
                </div>

                <div class="form-group">
                    <label for="middleName">Middle Name</label>
                    <input type="text" id="middleName" name="middleName">
                </div>

                <div class="form-group">
                    <label for="birthDate">Date of Birth <span>*</span></label>
                    <input type="date" id="birthDate" name="birthDate" required>
                </div>
            </section>

            <!-- Address -->
            <section>
                <h2>Mailing Address</h2>

                <div class="form-group">
                    <label>Address Type</label>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="addressType" value="metro" checked>
                            Metro Manila
                        </label>

                        <label>
                            <input type="radio" name="addressType" value="province">
                            Province
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="room">Room / Floor / Unit & Building Name</label>
                    <input type="text" id="room" name="room">
                </div>

                <div class="form-group">
                    <label for="house">House / Lot & Block No.</label>
                    <input type="text" id="house" name="house">
                </div>

                <div class="form-group">
                    <label for="street">Street</label>
                    <input type="text" id="street" name="street">
                </div>

                <div class="form-group">
                    <label for="subdivision">Subdivision</label>
                    <input type="text" id="subdivision" name="subdivision">
                </div>
            </section>

            <div id="message"></div>

            <button type="submit">Create Registration</button>

        </form>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
